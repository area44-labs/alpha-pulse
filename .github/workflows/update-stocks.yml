name: Update Stock Data Daily

on:
  schedule:
    # Run at 17:00 ICT (10:00 UTC) Monday through Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          install: true
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: |
          python scripts/update_stocks.py

      - name: Run formatting
        run: pnpm run check

      - name: Commit and push changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stocks.json src/data/agent_signals.json
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: auto-update stock prices and market indexes"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger GitHub Pages deployment
        if: steps.commit_changes.outputs.pushed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
