name: Update Stock Data Daily

on:
  schedule:
    # Run at 16:30 ICT (09:30 UTC) Monday through Friday
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install vnstock requests pandas openpyxl

      - name: Run update script
        run: |
          python scripts/update_stocks.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stocks.json
          git diff-index --quiet HEAD || git commit -m "chore: auto-update stock prices and market indexes"
          git push
