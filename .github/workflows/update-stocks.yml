name: Update Stock Data Daily

on:
  schedule:
    # Run at 11:30 ICT (04:30 UTC) and 16:30 ICT (09:30 UTC) Monday through Friday
    - cron: '30 4,9 * * 1-5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          install: true
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update report script
        run: |
          python scripts/generate_report.py --update

      - name: Run formatting and frontend checks
        run: pnpm run check

      - name: Commit and push changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: auto-update quantitative recommendations and market report"
            git push
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi
