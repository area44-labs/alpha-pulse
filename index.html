<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VN Invest - Khuyến Nghị Giao Dịch Chứng Khoán</title>
    <meta
      name="description"
      content="Khuyến nghị giao dịch cổ phiếu hằng ngày thị trường chứng khoán Việt Nam."
    />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem("theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
